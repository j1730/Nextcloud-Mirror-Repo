# .github/workflows/download_and_replace.yml

name: Download and Replace

# 控制触发此工作流的事件
on:
  # 每当有推送发生时触发工作流
  push:
    branches:
      - main
  # 允许手动触发此工作流
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # 每天凌晨 2 点触发
    
permissions:
  contents: write
  
jobs:
  download-and-replace:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Download apps.json from Nextcloud API
      run: |
        curl -L -o apps_ori.json --retry 3 https://apps.nextcloud.com/api/v1/apps.json
        curl -L -o discover_ori.json --retry 3 https://apps.nextcloud.com/api/v1/discover.json
        curl -L -o appapi_apps_ori.json --retry 3 https://apps.nextcloud.com/api/v1/appapi_apps.json
        curl -L -o categories.json --retry 3 https://apps.nextcloud.com/api/v1/categories.json

    - name: Replace github.com with github mirror in the JSON file
      run: |
        cat apps_ori.json | sed 's|github\.com|gh-proxy.com/https://github.com|g' > apps.json
        cat discover_ori.json | sed 's|github\.com|gh-proxy.com/https://github.com|g' > discover.json
        cat appapi_apps_ori.json | sed 's|github\.com|gh-proxy.com/https://github.com|g' > appapi_apps.json

    - name: Commit changes and push to repository
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add apps.json discover.json categories.json appapi_apps.json

        git diff --cached --quiet && exit 0
        
        git commit -m "镜像源每日更新"
        git push
